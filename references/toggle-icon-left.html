<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toggle with Icon/Image Left</title>
    <link rel="stylesheet" href="../dist/admin.css">
</head>
<body class="bg-gray-50 p-6">
    <div class="max-w-xl">
        <h1 class="text-base font-semibold text-gray-900">Icon/Image Left of Toggle</h1>

        <ul role="list" class="mt-4">
            <li class="flex items-center justify-between gap-x-6 py-5">
                <div class="flex min-w-0 items-center gap-x-4">
                    <span class="inline-flex h-8 w-8 items-center justify-center rounded-lg bg-gray-100 text-gray-600" aria-hidden="true">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="h-4 w-4">
                            <path d="M12 3v18"/>
                            <path d="M7 8h7a4 4 0 0 1 0 8H7"/>
                        </svg>
                    </span>
                    <div class="min-w-0">
                        <p class="text-sm/6 font-semibold text-gray-900">Cache Compression</p>
                        <p class="mt-1 text-xs/5 text-gray-500">Compress cached pages before serving them.</p>
                    </div>
                </div>
                <div class="group relative inline-flex w-11 shrink-0 rounded-full bg-gray-200 p-0.5 inset-ring inset-ring-gray-900/5 outline-offset-2 outline-indigo-600 transition-colors duration-200 ease-in-out has-checked:bg-indigo-600 has-focus-visible:outline-2">
                    <span class="size-5 rounded-full bg-white shadow-xs ring-1 ring-gray-900/5 transition-transform duration-200 ease-in-out group-has-checked:translate-x-5"></span>
                    <input type="checkbox" class="absolute inset-0 size-full appearance-none focus:outline-hidden" checked />
                </div>
            </li>
            <hr class="border-gray-200" />
            <li class="flex items-center justify-between gap-x-6 py-5">
                <div class="flex min-w-0 items-center gap-x-4">
                    <img src="../assets/img/performance-toolkit.svg" alt="Performance Toolkit" class="h-8 w-8 rounded-lg" />
                    <div class="min-w-0">
                        <p class="text-sm/6 font-semibold text-gray-900">Image Optimization</p>
                        <p class="mt-1 text-xs/5 text-gray-500">Automatically optimize uploaded media files.</p>
                    </div>
                </div>
                <div class="group relative inline-flex w-11 shrink-0 rounded-full bg-gray-200 p-0.5 inset-ring inset-ring-gray-900/5 outline-offset-2 outline-indigo-600 transition-colors duration-200 ease-in-out has-checked:bg-indigo-600 has-focus-visible:outline-2">
                    <span class="size-5 rounded-full bg-white shadow-xs ring-1 ring-gray-900/5 transition-transform duration-200 ease-in-out group-has-checked:translate-x-5"></span>
                    <input type="checkbox" class="absolute inset-0 size-full appearance-none focus:outline-hidden" />
                </div>
            </li>
            <hr class="border-gray-200" />
            <li class="flex items-center justify-between gap-x-6 py-5">
                <div class="flex min-w-0 items-center gap-x-4">
                    <span class="inline-flex h-8 w-8 items-center justify-center rounded-lg bg-gray-100 text-gray-600" aria-hidden="true">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="h-4 w-4">
                            <path d="M4 6h16"/>
                            <path d="M4 12h16"/>
                            <path d="M4 18h16"/>
                        </svg>
                    </span>
                    <div class="min-w-0">
                        <p class="text-sm/6 font-semibold text-gray-900">Script Minification</p>
                        <p class="mt-1 text-xs/5 text-gray-500">Reduce CSS and JS payload size on output.</p>
                    </div>
                </div>
                <div class="group relative inline-flex w-11 shrink-0 rounded-full bg-gray-200 p-0.5 inset-ring inset-ring-gray-900/5 outline-offset-2 outline-indigo-600 transition-colors duration-200 ease-in-out has-checked:bg-indigo-600 has-focus-visible:outline-2">
                    <span class="size-5 rounded-full bg-white shadow-xs ring-1 ring-gray-900/5 transition-transform duration-200 ease-in-out group-has-checked:translate-x-5"></span>
                    <input type="checkbox" class="absolute inset-0 size-full appearance-none focus:outline-hidden" checked />
                </div>
            </li>
        </ul>
    </div>
</body>
</html>
